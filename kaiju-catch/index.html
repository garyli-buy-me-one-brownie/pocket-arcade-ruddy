<style>
:root {
  /* Layout: full-bleed film frame. Ops-log cartouche top-left, transport strip along the bottom, settings panel top-right. */
  --film: #0b0a0d;
  --paper: #ece6d6;
  --paper-dim: rgba(236, 230, 214, 0.62);
  --vermilion: #d6402a;
  --amber: #f0b44a;
  --panel: rgba(12, 11, 15, 0.74);
  --rule: rgba(236, 230, 214, 0.18);
  --shade-strong: rgba(8, 7, 10, 0.88);
  --shade-clear: rgba(8, 7, 10, 0);
  --font-display: "Hiragino Mincho ProN", "Hiragino Mincho Pro", "Yu Mincho", YuMincho, "Noto Serif JP", "Noto Serif CJK JP", "Songti SC", serif;
  --font-ui: "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Yu Gothic", "Noto Sans JP", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: ui-monospace, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }
body { background: var(--film); color: var(--paper); overflow: hidden; font-family: var(--font-ui); -webkit-font-smoothing: antialiased; }
#stage { position: fixed; inset: 0; }
#stage canvas { display: block; width: 100%; height: 100%; touch-action: none; }

.log {
  position: fixed; z-index: 5; pointer-events: none;
  top: calc(env(safe-area-inset-top, 0px) + 14px); left: calc(env(safe-area-inset-left, 0px) + 14px);
  width: 214px; padding: 10px 12px 11px; background: var(--panel); border: 1px solid var(--rule);
  border-left: 3px solid var(--vermilion); font-family: var(--font-mono); font-size: 12px; line-height: 1.5;
  font-variant-numeric: tabular-nums;
}
.log-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; padding-bottom: 6px; margin-bottom: 6px; border-bottom: 1px solid var(--rule); }
.log-jp { font-family: var(--font-display); font-weight: 700; font-size: 14px; letter-spacing: 0.08em; white-space: nowrap; }
.log-en { font-size: 9px; letter-spacing: 0.14em; color: var(--paper-dim); text-transform: uppercase; }
.log dl { display: grid; gap: 2px; margin: 0; }
.log dl div { display: flex; justify-content: space-between; gap: 8px; }
.log dt { color: var(--paper-dim); }
.log dt small { font-size: 9px; letter-spacing: 0.1em; }
.log dd { margin: 0; color: var(--amber); }
.phase { display: flex; align-items: baseline; gap: 8px; margin-top: 7px; padding-top: 6px; border-top: 1px solid var(--rule); }
.phase b { font-family: var(--font-display); font-size: 22px; font-weight: 700; letter-spacing: 0.1em; color: var(--paper); }
.phase span { font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--paper-dim); }
.slowmo { margin-top: 6px; display: inline-block; padding: 1px 6px; border: 1px solid var(--vermilion); color: var(--vermilion); font-size: 11px; letter-spacing: 0.08em; }

.transport {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; display: grid; gap: 8px;
  padding-top: 26px; padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 12px);
  padding-left: max(14px, env(safe-area-inset-left, 0px)); padding-right: max(14px, env(safe-area-inset-right, 0px));
  background: linear-gradient(to top, var(--shade-strong), var(--shade-clear));
}
.transport { transition: opacity 0.45s ease; }
body.idle .transport:not(:focus-within) { opacity: 0; pointer-events: none; }
body.idle { cursor: none; }
.t-row { display: flex; align-items: center; gap: 10px; min-width: 0; }
.cams { flex-wrap: wrap; gap: 6px; }
.btn {
  appearance: none; font: inherit; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase;
  color: var(--paper); background: var(--panel); border: 1px solid var(--rule); padding: 6px 10px; cursor: pointer;
  display: inline-flex; align-items: center; gap: 6px; white-space: nowrap;
}
.btn:hover { border-color: var(--paper-dim); }
.btn:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }
.btn[aria-pressed="true"] { border-color: var(--vermilion); color: var(--amber); }
.btn kbd { font-family: var(--font-mono); font-size: 10px; color: var(--paper-dim); border: 1px solid var(--rule); padding: 0 4px; }
.play { width: 38px; justify-content: center; font-size: 13px; padding: 6px 0; }
.ref { border-color: var(--amber); }
.time { font-family: var(--font-mono); font-size: 12px; font-variant-numeric: tabular-nums; color: var(--amber); min-width: 62px; }
.scrub-wrap { position: relative; flex: 1; min-width: 0; height: 30px; display: flex; align-items: center; }
#scrub { width: 100%; margin: 0; appearance: none; background: transparent; height: 30px; cursor: pointer; position: relative; z-index: 1; }
#scrub::-webkit-slider-runnable-track { height: 3px; background: var(--rule); }
#scrub::-moz-range-track { height: 3px; background: var(--rule); }
#scrub::-webkit-slider-thumb { appearance: none; width: 14px; height: 14px; margin-top: -5.5px; background: var(--vermilion); border: 2px solid var(--paper); border-radius: 50%; }
#scrub::-moz-range-thumb { width: 10px; height: 10px; background: var(--vermilion); border: 2px solid var(--paper); border-radius: 50%; }
.ticks { position: absolute; left: 7px; right: 7px; top: 0; bottom: 0; pointer-events: none; }
.tick { position: absolute; top: -12px; transform: translateX(-1px); border-left: 1px solid var(--paper-dim); height: 26px; padding-left: 3px; font-family: var(--font-display); font-size: 11px; color: var(--paper-dim); white-space: nowrap; }
select { font: inherit; font-size: 12px; color: var(--paper); background: var(--panel); border: 1px solid var(--rule); padding: 5px 6px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

.title-card {
  position: fixed; inset: 0; z-index: 20; display: grid; place-content: center; justify-items: center; gap: 10px;
  text-align: center; cursor: pointer; background: radial-gradient(ellipse at center, var(--shade-clear), var(--shade-strong));
  animation: tc-in 0.5s ease-out both;
}
.title-card.out { animation: tc-out 0.6s ease-in both; }
.tc-kicker { font-family: var(--font-display); font-size: clamp(14px, 2.4vw, 22px); letter-spacing: 0.6em; color: var(--paper); padding-left: 0.6em; }
.tc-title { margin: 0; display: flex; flex-direction: column; align-items: center; font-family: var(--font-display); font-weight: 800; line-height: 1.02; font-size: clamp(54px, 12vw, 164px); letter-spacing: 0.08em; color: var(--vermilion); -webkit-text-stroke: 2px var(--paper); paint-order: stroke fill; text-shadow: 7px 7px 0 var(--shade-strong); }
.tc-en { font-size: clamp(11px, 1.6vw, 15px); letter-spacing: 0.42em; text-transform: uppercase; color: var(--paper); padding-left: 0.42em; }
.tc-skip { margin-top: 14px; font-size: 10px; letter-spacing: 0.24em; text-transform: uppercase; color: var(--paper-dim); }
@keyframes tc-in { from { opacity: 0; transform: scale(1.06); } to { opacity: 1; transform: none; } }
@keyframes tc-out { to { opacity: 0; } }

.err { position: fixed; inset: 0; z-index: 30; display: grid; place-content: center; padding: 24px; text-align: center; background: var(--film); color: var(--paper); font-size: 14px; line-height: 1.6; }
.err b { color: var(--amber); }
html[lang^="zh"] { --font-ui: "PingFang HK", "PingFang TC", "Noto Sans TC", "Hiragino Sans", system-ui, -apple-system, "Segoe UI", sans-serif; }
.nav { justify-content: space-between; }
.home { font-family: var(--font-display); font-weight: 800; font-size: 12px; letter-spacing: 0.2em; color: var(--paper-dim); text-decoration: none; white-space: nowrap; padding: 4px 0; }
.home:hover, .home:focus-visible { color: var(--paper); }
.langs { display: flex; align-items: center; gap: 6px; }
.langs svg { width: 16px; height: 16px; color: var(--paper-dim); }
.lg { min-width: 38px; justify-content: center; }

.lil-gui.root { top: calc(env(safe-area-inset-top, 0px) + 10px) !important; right: calc(env(safe-area-inset-right, 0px) + 10px) !important; max-height: calc(100% - 170px); overflow-y: auto; }

@media (max-width: 720px) {
  .log { width: 168px; font-size: 11px; padding: 8px 10px; top: calc(env(safe-area-inset-top, 0px) + 58px); }
  .phase b { font-size: 18px; }
  .tick { font-size: 0; height: 16px; top: -2px; }
  .home .long { display: none; }
  .log-en { display: none; }
  .btn { padding: 6px 8px; font-size: 10px; }
  .btn kbd { display: none; }
  .t-row { gap: 8px; }
}
@media (prefers-reduced-motion: reduce) {
  .title-card, .title-card.out { animation: none; }
}
</style>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import GUI from 'lil-gui';

// ============================================================================
// CONFIG — every tunable in one place. Camera values are calibrated from the
// reference frames of the Flight 15 / Ship 42 catch video (10:26 onward).
// ============================================================================
const CONFIG = {
  style:    { look: 'tokusatsu', grain: 0.5, halation: 0.6, gateWeavePx: 1.5, dustScratches: true,
              aspect: '1.85', fps24: true, titleCard: true, directorCuts: false },
  timeline: { duration: 85, timeScale: 1, loop: true, startAt: 0, spaceIntro: true, slowMoFactor: 0.4 },
  squid:    { intensity: 0.9, tentacles: true, ink: true, inkDensity: 1.6, chopstickStyle: 'wood',
              showWires: false, hug: true, hugTurns: 1.25 },
  ship:     { length: 52, diameter: 9, catchPinOffsetFromNose: 21.5 },   // pins sit ~21 m below the nose (frame 5)
  tower:    { height: 135, chopstickLength: 32, catchHeight: 120 },
  descent:  { startAlt: 3000, bellyFlopSpeed: 84, flipAlt: 650, lateralDivert: 75, touchSpeed: 1.5 },
  sun:      { elevationDeg: 26, azimuthDeg: 225 },                       // 15:20 CST, 14 Nov, Starbase; overcast
  camera:   { preset: 'VIDEO_MATCH', distance: 2000, height: 115, azimuthDeg: 0,
              vfovPadDeg: 16, fovCatchDeg: 4.6, horizonPct: 74, towerXPct: 49 },  // horizon/tower as % from top/left
  render:   { maxPixelRatio: 2 },
};

const QS = new URLSearchParams(location.search);
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
const MOBILE = matchMedia('(pointer: coarse)').matches || Math.min(innerWidth, innerHeight) < 560;

// ---------- helpers ----------
const V3 = THREE.Vector3;
const DEG = Math.PI / 180;
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const sstep = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const bump = (x, c, w) => Math.exp(-(((x - c) / w) ** 2));
function easeOutBack(x) { const c1 = 1.6, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); }
function mulberry32(a) { return function () { a |= 0; a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
function randDir(rng, out = new V3()) { const u = rng() * 2 - 1, th = rng() * Math.PI * 2, s = Math.sqrt(1 - u * u); return out.set(s * Math.cos(th), u, s * Math.sin(th)); }

// ---------- vehicle + site geometry constants ----------
const SHIP_L = CONFIG.ship.length, SHIP_R = CONFIG.ship.diameter / 2;
const NOSE_LEN = SHIP_L * 0.35;
const COM = SHIP_L * 0.35;                         // centre of mass above the base
const PIN_BASE = SHIP_L - CONFIG.ship.catchPinOffsetFromNose;
const PIN_UP = PIN_BASE - COM;                     // pin centre above the CoM
const PIN_R = 0.6;
const TOWER_HALF = 5.5;
const CATCH_X = -(TOWER_HALF + 3.0 + SHIP_R);     // ship axis hangs here, beside the tower face
const ARM_Z = SHIP_R + 1.5;
const T_CONTACT = 58.5;
const REF_T = 41.3;                                // matches the 10:26 frame: upright, ~390 m, engines lit

function hullR(y) {
  const yb = SHIP_L - NOSE_LEN;
  if (y <= yb) return SHIP_R;
  const t = Math.min(1, (y - yb) / NOSE_LEN);
  return SHIP_R * Math.pow(Math.max(0, 1 - Math.pow(t, 1.9)), 0.62);
}

// ============================================================================
// TRAJECTORY — analytic Hermite segments; every state is a pure function of t
// ============================================================================
let KEYS = [];
const contactY = () => CONFIG.tower.catchHeight + PIN_R - PIN_UP;
function buildKeys() {
  const D = CONFIG.descent, cy = contactY();
  KEYS = [
    { t: 0,  p: [1400, D.startAlt + 2600, -700], v: [-110, -560, 45] },
    { t: 8,  p: [850, D.startAlt, -420],         v: [-25, -D.bellyFlopSpeed, 15] },
    { t: 36, p: [150, D.flipAlt, -20],           v: [-25, -D.bellyFlopSpeed, 4] },
    { t: 41, p: [CATCH_X + D.lateralDivert, 360, -10], v: [-22, -40, 2] },
    { t: 49, p: [CATCH_X, 205, 0],               v: [0, -14, 0] },
    { t: 54, p: [CATCH_X, cy + 8, 0],            v: [0, -1.8, 0] },
    { t: T_CONTACT, p: [CATCH_X, cy, 0],         v: [0, -D.touchSpeed, 0] },
  ];
}
function traj(t, P, Vv) {
  const K = KEYS;
  if (t <= K[0].t) { for (let c = 0; c < 3; c++) { P[c] = K[0].p[c] + K[0].v[c] * (t - K[0].t); Vv[c] = K[0].v[c]; } return; }
  const last = K[K.length - 1];
  if (t >= last.t) { for (let c = 0; c < 3; c++) { P[c] = last.p[c]; Vv[c] = 0; } return; }
  let i = 0; while (t > K[i + 1].t) i++;
  const k0 = K[i], k1 = K[i + 1], h = k1.t - k0.t, s = (t - k0.t) / h, s2 = s * s, s3 = s2 * s;
  const h00 = 2 * s3 - 3 * s2 + 1, h10 = s3 - 2 * s2 + s, h01 = -2 * s3 + 3 * s2, h11 = s3 - s2;
  const d00 = 6 * s2 - 6 * s, d10 = 3 * s2 - 4 * s + 1, d01 = -6 * s2 + 6 * s, d11 = 3 * s2 - 2 * s;
  for (let c = 0; c < 3; c++) {
    P[c] = h00 * k0.p[c] + h10 * h * k0.v[c] + h01 * k1.p[c] + h11 * h * k1.v[c];
    Vv[c] = (d00 * k0.p[c] + d10 * h * k0.v[c] + d01 * k1.p[c] + d11 * h * k1.v[c]) / h;
  }
}
function throttleAt(t) {
  if (t < 36) return 0;
  if (t < 36.4) return (t - 36) / 0.4;
  if (t < 41) return 1;
  if (t < T_CONTACT) return lerp(0.85, 0.5, sstep(41, 56, t));
  if (t < T_CONTACT + 0.3) return 0.5 * (1 - (t - T_CONTACT) / 0.3);
  return 0;
}
const heatAt = (t) => (CONFIG.timeline.spaceIntro ? 1 - sstep(1.5, 9, t) : 0);
const exciteAt = (t) => 0.12 + 0.9 * bump(t, 36.8, 1.4) + 0.85 * bump(t, 59, 1.2) + 0.3 * bump(t, 63.5, 2.5);
const calmAt = (t) => sstep(61, 67, t);
function rateAt(t) {
  const w = sstep(35.4, 36.2, t) * (1 - sstep(40.6, 41.6, t)) + sstep(57.2, 58.0, t) * (1 - sstep(60.4, 61.4, t));
  return lerp(1, CONFIG.timeline.slowMoFactor, w);
}

const _P = [0, 0, 0], _V = [0, 0, 0], _PA = [0, 0, 0], _VA = [0, 0, 0], _PB = [0, 0, 0], _VB = [0, 0, 0];
const _qz = new THREE.Quaternion(), _qy = new THREE.Quaternion();
const AXZ = new V3(0, 0, 1), AXY = new V3(0, 1, 0);
function newState() { return { pos: new V3(), vel: new V3(), quat: new THREE.Quaternion(), axis: new V3(), phi: 0, carriageDy: 0, throttle: 0 }; }
function shipState(t, out) {
  traj(t, _P, _V); traj(t - 0.6, _PA, _VA); traj(t + 0.6, _PB, _VB);
  const ax = (_VB[0] - _VA[0]) / 1.2, ay = (_VB[1] - _VA[1]) / 1.2;
  const phiT = clamp(Math.atan2(-ax, ay + 9.81), -35 * DEG, 35 * DEG);  // body axis follows the thrust vector
  const wob = 3 * DEG * Math.sin(0.9 * t);
  const roll = 2 * DEG * Math.sin(0.6 * t + 1.0) * (1 - sstep(36, 39, t));
  let phi;
  if (t < 36) phi = Math.PI / 2 + wob;                                 // belly-flop: horizontal, heat shield down
  else if (t < 41) phi = lerp(Math.PI / 2 + wob, phiT, easeOutBack((t - 36) / 5));  // flip with overshoot
  else if (t < T_CONTACT) phi = phiT * (1 - sstep(54.5, T_CONTACT, t));
  else phi = 0;
  out.pos.set(_P[0], _P[1], _P[2]); out.vel.set(_V[0], _V[1], _V[2]); out.carriageDy = 0;
  if (t >= T_CONTACT) {                                                // pins on the chopsticks: bounce + pendulum sway
    const tau = t - T_CONTACT;
    const dy = -0.5 * Math.exp(-1.8 * tau) * Math.sin(2 * Math.PI * 1.1 * tau);
    const sway = 1.6 * DEG * Math.exp(-0.45 * tau) * Math.sin(2 * Math.PI * 0.35 * tau);
    const py = CONFIG.tower.catchHeight + dy + PIN_R;
    out.pos.set(CATCH_X + Math.sin(sway) * PIN_UP, py - Math.cos(sway) * PIN_UP, 0);
    out.vel.set(0, 0, 0);
    out.carriageDy = dy; phi = sway;
  }
  out.phi = phi;
  _qz.setFromAxisAngle(AXZ, phi); _qy.setFromAxisAngle(AXY, -Math.PI / 2 + roll);
  out.quat.copy(_qz).multiply(_qy);
  out.axis.set(0, 1, 0).applyQuaternion(out.quat);
  out.throttle = throttleAt(t);
  return out;
}

const GLSL_NOISE = /* glsl */`
float hash12(vec2 p){ vec3 p3 = fract(vec3(p.xyx) * 0.1031); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.x + p3.y) * p3.z); }
float hash13(vec3 p3){ p3 = fract(p3 * 0.1031); p3 += dot(p3, p3.zyx + 31.32); return fract((p3.x + p3.y) * p3.z); }
vec3 hash33(vec3 p3){ p3 = fract(p3 * vec3(0.1031, 0.1030, 0.0973)); p3 += dot(p3, p3.yxz + 33.33); return fract((p3.xxy + p3.yxx) * p3.zyx); }
float vnoise(vec2 p){ vec2 i = floor(p); vec2 f = fract(p); vec2 u = f * f * (3.0 - 2.0 * f);
  return mix(mix(hash12(i), hash12(i + vec2(1.0, 0.0)), u.x), mix(hash12(i + vec2(0.0, 1.0)), hash12(i + vec2(1.0, 1.0)), u.x), u.y); }
float vnoise3(vec3 p){ vec3 i = floor(p); vec3 f = fract(p); vec3 u = f * f * (3.0 - 2.0 * f);
  float a = mix(mix(hash13(i), hash13(i + vec3(1.0, 0.0, 0.0)), u.x), mix(hash13(i + vec3(0.0, 1.0, 0.0)), hash13(i + vec3(1.0, 1.0, 0.0)), u.x), u.y);
  float b = mix(mix(hash13(i + vec3(0.0, 0.0, 1.0)), hash13(i + vec3(1.0, 0.0, 1.0)), u.x), mix(hash13(i + vec3(0.0, 1.0, 1.0)), hash13(i + vec3(1.0, 1.0, 1.0)), u.x), u.y);
  return mix(a, b, u.z); }
float fbm2(vec2 p){ float a = 0.5, s = 0.0; for (int i = 0; i < 5; i++){ s += a * vnoise(p); p = p * 2.03 + vec2(17.1, 9.2); a *= 0.5; } return s; }
float fbm3(vec3 p){ float a = 0.5, s = 0.0; for (int i = 0; i < 4; i++){ s += a * vnoise3(p); p = p * 2.02 + vec3(7.1, 3.3, 1.7); a *= 0.5; } return s; }
`;

const skyUniforms = {

    varying vec3 vDir;
    ${GLSL_NOISE}
    void main(){
      vec3 d = normalize(vDir);
      float e = d.y;
      vec3 col = mix(uHorizon, uMid, smoothstep(0.0, 0.16, e));
      col = mix(col, uZenith, smoothstep(0.12, 0.8, e));

    }`,
});

function beamMatrix(a, b, th) {
  const mid = a.clone().add(b).multiplyScalar(0.5);
  const dir = b.clone().sub(a); const len = dir.length();
  const q = new THREE.Quaternion().setFromUnitVectors(new V3(1, 0, 0), dir.normalize());
  return new THREE.Matrix4().compose(mid, q, new V3(len, th, th));
}
function buildTower(x, z, h) {
  const mats = [];
  const c = TOWER_HALF - 0.6;
  for (const sx of [-1, 1]) for (const sz of [-1, 1]) mats.push(new THREE.Matrix4().compose(new V3(sx * c, h / 2, sz * c), new THREE.Quaternion(), new V3(1.2, h, 1.2)));
  const lv = 9, n = Math.floor(h / lv);
  const corners = [[-c, -c], [c, -c], [c, c], [-c, c]];
  for (let i = 0; i <= n; i++) {
    const y = i * lv;
    for (let f = 0; f < 4; f++) {
      const A = corners[f], B = corners[(f + 1) % 4];
      mats.push(beamMatrix(new V3(A[0], y, A[1]), new V3(B[0], y, B[1]), 0.6));
      if (i < n) {
        mats.push(beamMatrix(new V3(A[0], y, A[1]), new V3(B[0], y + lv, B[1]), 0.45));
        mats.push(beamMatrix(new V3(B[0], y, B[1]), new V3(A[0], y + lv, A[1]), 0.45));
      }
    }
  }
  mats.push(new THREE.Matrix4().compose(new V3(0, h + 1, 0), new THREE.Quaternion(), new V3(TOWER_HALF * 2 + 1, 2, TOWER_HALF * 2 + 1)));
  mats.push(new THREE.Matrix4().compose(new V3(0, h + 9, 0), new THREE.Quaternion(), new V3(0.5, 15, 0.5)));
  mats.push(new THREE.Matrix4().compose(new V3(2.5, h + 4, 2.5), new THREE.Quaternion(), new V3(3, 5, 3)));
  const im = new THREE.InstancedMesh(unitBox, steelMat, mats.length);
  mats.forEach((m, i) => im.setMatrixAt(i, m));
  im.position.set(x, 0, z);
  scene.add(im);
  return im;
}

  if (CONFIG.style.directorCuts && preset === 'VIDEO_MATCH' && ((t > 36.2 && t < 41) || (t > 55.5 && t < 61))) preset = 'KAIJU_LOW';
  if (preset === 'FREE') {
    if (lastPreset !== 'FREE') {
      controls.enabled = true;
      camera.position.set(260, 170, 420);
      controls.target.set(-6, 95, 0);
      camera.fov = 2 * Math.atan(Math.tan(36 * DEG / 2) / bandFrac) / DEG; camera.updateProjectionMatrix();
    }
    controls.update();

  }
  controls.enabled = false;
  let fov;
  if (preset === 'KAIJU_LOW') fov = rigKaiju(t, _cPos, _cTgt);
  else if (preset === 'TOWER_CAM') fov = rigTower(t, _cPos, _cTgt);
  else if (preset === 'CHASE') fov = rigChase(t, _cPos, _cTgt);

function update(t) {

  bodyMat.clearcoat = sq * 0.75;

  // flaps / fins

  const defF = belly * (15 * DEG + 10 * DEG * Math.sin(1.3 * t)) + (1 - belly) * 45 * DEG;
  const defA = belly * (8 * DEG + 7 * DEG * Math.sin(1.1 * t + 1)) + (1 - belly) * 30 * DEG;
  flapMat.color.copy(FLAP_DARK).lerp(FIN_COL, sq);
  flaps[0].update(sq, t, defF); flaps[1].update(sq, t, defF);
  flaps[2].update(sq, t, defA); flaps[3].update(sq, t, defA);
  const eyeS = Math.max(0.001, sstep(0.3, 0.7, sq));
  eyes.forEach((e) => e.scale.setScalar(eyeS));
  siphon.scale.setScalar(Math.max(0.001, sstep(0.12, 0.5, sq)));

  // flame + glows
  const thr = S.throttle;
  flame.visible = thr > 0.01;
  flame.scale.set(1, (32 + 4 * Math.sin(t * 23)) * (0.6 + 0.4 * thr) * lerp(1, 0.75, sq), 1);
  flameU.uThrottle.value = thr;

  // carriage + chopsticks
  const tau = t - T_CONTACT;
  carriage.position.set(0, CONFIG.tower.catchHeight + S.carriageDy, 0);
  const beta = lerp(48 * DEG, -1.5 * DEG, sstep(52.5, 57, t));
  const flex = tau > 0 ? -0.4 * DEG * Math.exp(-1.8 * tau) * Math.sin(2 * Math.PI * 1.1 * tau) : 0;
  for (const pv of pivots) pv.rotation.set(0, Math.PI + pv.userData.side * beta, flex);
  const useWood = CONFIG.squid.chopstickStyle === 'wood' && sq >= 0.15;
  for (const m of chopMeshes) m.material = useWood ? woodMat : trussMat;

  updateLimbs(t, S, sq);

  // wires
  wires.visible = CONFIG.squid.showWires;
  if (wires.visible) {
    const a = wireGeo.attributes.position.array;
    const pts = [new V3(0, SHIP_L - COM, 0).applyQuaternion(S.quat).add(S.pos)];
    for (const i of [0, 3, 5, 8]) pts.push(limbs[i].spine[30].clone());

  inkMat.uniforms.uTime.value = t; glowMat.uniforms.uTime.value = t;
  inkMat.uniforms.uClear.value = sstep(52, 57, t) * (1 - sstep(76, 84, t));

  inkMat.uniforms.uSquid.value = sq; inkMat.uniforms.uInkOn.value = CONFIG.squid.ink ? 1 : 0;
  skyUniforms.uTime.value = t;

  updateCamera(t);
  sky.position.copy(camera.position);

  // ops log
  hud.t.textContent = fmt(t);
  hud.alt.textContent = Math.max(0, S.pos.y).toFixed(0) + ' m';
  hud.vs.textContent = (S.vel.y >= 0 ? '+' : '−') + Math.abs(S.vel.y).toFixed(1) + ' m/s';
  let ph = PHASES[0]; for (const p of PHASES) if (t >= p.t) ph = p;
  const pt = phaseText(ph);
  if (hud.phaseJp.textContent !== pt[0] || hud.phaseEn.textContent !== pt[1]) { hud.phaseJp.textContent = pt[0]; hud.phaseEn.textContent = pt[1]; }
  const rate = rateAt(t);
  hud.slow.hidden = !(rate < 0.9 && playing);
  hud.slowF.textContent = '×' + CONFIG.timeline.slowMoFactor.toFixed(2).replace(/0$/, '');

  if (!titleActive) return;
  titleActive = false; tc.classList.add('out');
  setTimeout(() => { tc.hidden = true; }, 600);
}
if (CONFIG.style.titleCard && !REDUCED && !QS.has('notitle') && !QS.has('t')) {
  titleActive = true; tc.hidden = false;
  setTimeout(endTitle, 3400);
  tc.addEventListener('click', endTitle);
}
if (REDUCED && !QS.has('t')) t = REF_T;
applyLang();

// ============================================================================
// RESIZE + LOOP
// ============================================================================
function resize() {
  const W = innerWidth, H = innerHeight, a = W / H;
  renderer.setSize(W, H); composer.setSize(W, H);
  const pr = renderer.getPixelRatio();
  film.uniforms.uRes.value.set(W * pr, H * pr);
  camera.aspect = a;
  const on = CONFIG.style.look === 'tokusatsu';
  const map = { full: a, '1.85': 1.85, '2.35': 2.35, '4:3': 4 / 3 };
  let target = map[CONFIG.style.aspect] ?? a;
  if (!on || a < 1.0) target = a;
  const box = film.uniforms.uBox.value;
  bandFrac = 1; bandAspect = a; box.set(0, 0, 1, 1);
  if (target > a + 1e-3) { const h = a / target; box.set(0, (1 - h) / 2, 1, 1 - (1 - h) / 2); bandFrac = h; bandAspect = target; }
  else if (target < a - 1e-3) { const w = target / a; box.set((1 - w) / 2, 0, 1 - (1 - w) / 2, 1); bandAspect = target; }
  camera.updateProjectionMatrix();
  if (CONFIG.camera.preset === 'FREE') { camera.fov = 2 * Math.atan(Math.tan(36 * DEG / 2) / bandFrac) / DEG; camera.updateProjectionMatrix(); }
  dirty = true;
}
addEventListener('resize', resize);

buildKeys();
buildParticles();
resize();
applyLook();

let last = performance.now(), acc = 0, wall = 0;
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.1, (now - last) / 1000); last = now;
  if (document.hidden) return;
  wall += dt;
  if (playing && !titleActive && !scrubbing) {
    t += dt * CONFIG.timeline.timeScale * rateAt(t);
    if (t >= CONFIG.timeline.duration) {
      if (CONFIG.timeline.loop) t = CONFIG.timeline.spaceIntro ? 0 : 8;
      else { t = CONFIG.timeline.duration; setPlaying(false); }
    }
    dirty = true;
  }
  const on = CONFIG.style.look === 'tokusatsu';
  const cadence = on && CONFIG.style.fps24 && !REDUCED ? 1 / 24 : 0;
  acc += dt;
  if (cadence && acc < cadence) return;
  acc = cadence ? acc % cadence : 0;
  // film grain keeps moving even when paused; the scene itself only changes when dirty
  film.uniforms.uFrame.value = Math.floor(wall * 24);
  film.uniforms.uGrain.value = CONFIG.style.grain;
  film.uniforms.uHal.value = CONFIG.style.halation;
  film.uniforms.uWeave.value = REDUCED ? 0 : CONFIG.style.gateWeavePx;
  film.uniforms.uDust.value = CONFIG.style.dustScratches ? 1 : 0;
  if (dirty || CONFIG.camera.preset === 'FREE') { update(t); dirty = playing; }
  composer.render();
}
window.__ikaReady = true;
requestAnimationFrame(frame);
</script>
