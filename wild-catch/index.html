<style>
:root {
  /* Layout: one screen. Portrait film frame on top, three big thumb buttons underneath. Single dark look by choice. */
  --film: #0b0a0d;
  --paper: #ece6d6;
  --paper-dim: rgba(236, 230, 214, 0.65);
  --vermilion: #d6402a;
  --amber: #f0b44a;
  --panel: rgba(12, 11, 15, 0.88);
  --rule: rgba(236, 230, 214, 0.22);
  --font-display: "Hiragino Mincho ProN", "Yu Mincho", "Noto Serif JP", "Noto Serif CJK TC", "Songti TC", serif;
  --font-ui: "PingFang HK", "PingFang TC", "Hiragino Sans", "Noto Sans TC", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--film); color: var(--paper); font-family: var(--font-ui);
  display: flex; flex-direction: column; gap: 10px; overflow: hidden;
  height: 100dvh;
  padding-top: max(10px, env(safe-area-inset-top, 0px)); padding-bottom: max(10px, env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  box-sizing: border-box;
}
.stage { position: relative; flex: 1; min-height: 0; }
canvas { width: 100%; height: 100%; object-fit: contain; display: block; }
.panel {
  position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
  width: min(330px, 92%); box-sizing: border-box; padding: 20px 20px 18px;
  background: var(--panel); border: 1px solid var(--rule); border-top: 3px solid var(--vermilion);
  text-align: center; display: grid; gap: 10px;
  max-height: calc(100% - 12px); overflow-y: auto;
}
.panel h1 { margin: 0; font-family: var(--font-display); font-weight: 800; font-size: 30px; letter-spacing: 0.08em; color: var(--vermilion); -webkit-text-stroke: 1px var(--paper); paint-order: stroke fill; text-wrap: balance; word-break: keep-all; }
@media (max-width: 380px) { .panel h1 { font-size: 26px; } }
.panel p { margin: 0; font-size: 14px; line-height: 1.6; color: var(--paper); }
.panel .dim { color: var(--paper-dim); font-size: 12px; }
.panel .num { color: var(--amber); font-variant-numeric: tabular-nums; }
.btn {
  appearance: none; font: inherit; color: var(--paper); background: var(--panel); border: 1px solid var(--rule);
  cursor: pointer; touch-action: none; user-select: none; -webkit-user-select: none;
}
.btn:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }
.go { padding: 11px 14px; font-size: 15px; letter-spacing: 0.1em; border-color: var(--vermilion); color: var(--amber); }
.go:hover { background: var(--vermilion); color: var(--paper); }
.row { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
.sm { padding: 8px 10px; font-size: 12px; letter-spacing: 0.06em; }
.sm:hover { border-color: var(--paper-dim); }
.hint { position: absolute; left: 50%; top: 12px; transform: translateX(-50%); padding: 6px 12px; background: var(--panel); border: 1px solid var(--rule); font-size: 12px; white-space: nowrap; pointer-events: none; }
.pad { display: grid; grid-template-columns: 1fr 1.5fr 1fr; gap: 10px; width: min(480px, 100%); margin: 0 auto; }
.pad .btn { height: 58px; font-size: 16px; letter-spacing: 0.08em; }
.pad .btn.on { border-color: var(--amber); color: var(--amber); }
.pad .btn small { display: block; font-size: 10px; color: var(--paper-dim); letter-spacing: 0.12em; }
.bar { display: flex; align-items: center; justify-content: space-between; width: min(480px, 100%); margin: 0 auto; }
.brand { font-family: var(--font-display); font-weight: 800; font-size: 13px; letter-spacing: 0.22em; color: var(--paper-dim); text-decoration: none; padding: 8px 0; }
.brand:hover, .brand:focus-visible { color: var(--paper); }
.langs { display: flex; align-items: center; gap: 6px; }
.langs svg { width: 17px; height: 17px; color: var(--paper-dim); margin-right: 2px; }
.lg { min-width: 42px; height: 32px; padding: 0 8px; font-size: 13px; letter-spacing: 0.04em; }
.lg:hover { border-color: var(--paper-dim); }
.lg[aria-pressed="true"] { border-color: var(--amber); color: var(--amber); }
.brand { white-space: nowrap; }
@media (max-width: 460px) { .brand { letter-spacing: 0.12em; } .brand .long { display: none; } }
.chal { margin: 0; padding: 8px 10px; border: 1px dashed var(--amber); color: var(--amber); font-size: 13px; line-height: 1.5; }
.share { display: grid; gap: 8px; }
.share > p { margin: 2px 0 0; }
.sh { display: inline-flex; align-items: center; gap: 6px; }
.sh svg { width: 16px; height: 16px; flex: none; }
.wa { color: #4fdc84; border-color: rgba(79, 220, 132, 0.55); }
.wa:hover { background: rgba(37, 211, 102, 0.16); border-color: #4fdc84; }
.th:hover { background: rgba(236, 230, 214, 0.1); border-color: var(--paper); }
.card { display: block; width: 100%; aspect-ratio: 1200 / 630; border: 1px solid var(--rule); background: #000; }
</style>

    if (mode === 'play' && modeT < 2.4) {                                           // still glowing from reentry
      var hg = ctx.createRadialGradient(s.x, s.y, 4, s.x, s.y, 80), ha = 1 - modeT / 2.4;
      hg.addColorStop(0, 'rgba(255,150,70,' + 0.6 * ha + ')'); hg.addColorStop(1, 'rgba(255,90,30,0)');
      ctx.fillStyle = hg; ctx.beginPath(); ctx.arc(s.x, s.y, 80, 0, 6.3); ctx.fill();
    }
    ctx.save(); ctx.translate(s.x, s.y); ctx.rotate(s.a); ctx.lineCap = 'round';
    var lag = clamp(-s.w * 7, -16, 16);
    for (i = 0; i < 10; i++) {
      var o = i - 4.5, bx = o * 2.5, by = 52, long = i === 2 || i === 7;
      var len = (long ? 66 : 42) * (limp ? 0.5 : 1), spread = jet ? 7.5 : 3.5;
      var ex = bx + o * spread + Math.sin(time * 3 + i * 1.3) * 5 + lag, ey = by + len + Math.cos(time * 2.3 + i) * 4;
      var cx = bx + o * 1.5 + Math.sin(time * 2 + i) * 4 + lag * 0.4, cy = by + len * 0.5;
      if (hug > 0) {
        var hx = TOWER_X - s.x + (i % 2 ? TOWER_W + 3 : TOWER_W * 0.35), hy = by + 8 + i * 9, kx = TOWER_X - s.x - 8, ky = by + 12 + i * 6;
        if (i === 7) { hx = 30; hy = 7; kx = 48; ky = by - 14; }                                     // coils round the chopstick
        if (i === 2) { hx = -46 + Math.sin(time * 6) * 9; hy = by - 40 + Math.cos(time * 6) * 4; kx = -46; ky = by + 16; }   // waves
        var w = ease(hug * 1.3 - i * 0.03);
        ex = lerp(ex, hx, w); ey = lerp(ey, hy, w); cx = lerp(cx, kx, w); cy = lerp(cy, ky, w);
      }
      limb(bx, by, cx, cy, ex, ey, long ? 3 : 4.4, long ? 1.6 : 1, i % 2 ? '#3d1711' : '#27100d');
      if (long) {
        ctx.fillStyle = '#3d1711'; ctx.beginPath(); ctx.ellipse(ex, ey, 3.6, 6, 0, 0, 6.3); ctx.fill();
        ctx.fillStyle = 'rgba(214,170,150,0.7)'; for (var q = -1; q <= 1; q++) { ctx.beginPath(); ctx.arc(ex, ey + q * 3, 0.9, 0, 6.3); ctx.fill(); }
      }
    }
    if (jet) {
      var fl = ctx.createRadialGradient(0, 58, 0, 0, 58, 22);
      fl.addColorStop(0, 'rgba(255,230,180,0.95)'); fl.addColorStop(0.4, 'rgba(240,120,50,0.5)'); fl.addColorStop(1, 'rgba(240,120,50,0)');
      ctx.fillStyle = fl; ctx.beginPath(); ctx.arc(0, 58, 22, 0, 6.3); ctx.fill();
    }
    // fins
    var flap = Math.sin(time * 5) * 3;
    for (var sd = -1; sd <= 1; sd += 2) {
      var f = flap * sd;
      var fg = ctx.createLinearGradient(0, 0, sd * 30, 0); fg.addColorStop(0, '#2a1210'); fg.addColorStop(1, '#4a1f16');
      ctx.fillStyle = fg; ctx.beginPath(); ctx.moveTo(sd * 5, -47);
      ctx.quadraticCurveTo(sd * 31, -42 + f, sd * 28, -25 + f); ctx.quadraticCurveTo(sd * 20, -12, sd * (RAD - 1), -11); ctx.closePath(); ctx.fill();
      ctx.strokeStyle = 'rgba(120,50,34,0.6)'; ctx.lineWidth = 0.7;
      ctx.beginPath(); ctx.moveTo(sd * 9, -38); ctx.lineTo(sd * 26, -30 + f); ctx.moveTo(sd * 11, -28); ctx.lineTo(sd * 24, -22 + f); ctx.stroke();
    }
    // head and siphon
    ctx.fillStyle = '#34140f'; ctx.beginPath(); ctx.ellipse(0, 47, 10.5, 8, 0, 0, 6.3); ctx.fill();
    ctx.fillStyle = '#1c0a09'; ctx.beginPath(); ctx.ellipse(0, 54, 4, 3, 0, 0, 6.3); ctx.fill();
    // mantle, pinched at the waist once the chopsticks close
    var mg = ctx.createLinearGradient(-RAD, 0, RAD, 0);
    mg.addColorStop(0, '#100708'); mg.addColorStop(0.35, '#2e1411'); mg.addColorStop(0.6, '#1f0d0c'); mg.addColorStop(1, '#0d0607');
    ctx.fillStyle = mg; ctx.beginPath(); ctx.moveTo(0, -50);
    ctx.bezierCurveTo(9, -38, RAD, -24, RAD, -9); ctx.quadraticCurveTo(RAD - 5 * pinch, 0, RAD, 9);
    ctx.lineTo(RAD, 38); ctx.quadraticCurveTo(RAD, 46, 0, 46); ctx.quadraticCurveTo(-RAD, 46, -RAD, 38);
    ctx.lineTo(-RAD, 9); ctx.quadraticCurveTo(-RAD + 5 * pinch, 0, -RAD, -9); ctx.bezierCurveTo(-RAD, -24, -9, -38, 0, -50); ctx.fill();
    ctx.strokeStyle = 'rgba(255,225,205,0.13)'; ctx.lineWidth = 2.6; ctx.beginPath(); ctx.moveTo(-6, -36); ctx.quadraticCurveTo(-9, 0, -8, 36); ctx.stroke();
    ctx.strokeStyle = 'rgba(0,0,0,0.5)'; ctx.lineWidth = 1.2; ctx.beginPath(); ctx.moveTo(-RAD, 41); ctx.quadraticCurveTo(0, 46, RAD, 41); ctx.stroke();
    // chromatophores
    var exc = mode === 'caught' ? 1 : jet ? 0.7 : 0.25;
    for (var c = 0; c < 22; c++) {
      var sx = Math.sin(c * 12.9) * 10, sy = -34 + ((c * 37) % 74), rr = 1.1 + ((c * 7) % 3) * 0.6 + Math.sin(time * 3 + c) * 0.6 * exc;
      if (Math.abs(sx) > RAD * (sy < -9 ? clamp((sy + 50) / 41, 0, 1) : 1) - 2) continue;
      ctx.fillStyle = 'rgba(226,84,40,' + (0.3 + 0.65 * exc) + ')'; ctx.beginPath(); ctx.arc(sx, sy, Math.max(0.5, rr), 0, 6.3); ctx.fill();
    }
    // eyes
    for (var e = -1; e <= 1; e += 2) {
      ctx.fillStyle = '#b07a30'; ctx.beginPath(); ctx.arc(e * 8, 47, 4, 0, 6.3); ctx.fill();
      ctx.fillStyle = '#060607'; ctx.beginPath(); ctx.arc(e * 8, 47, 2.6, 0, 6.3); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.8)'; ctx.beginPath(); ctx.arc(e * 8 - 1, 46, 0.8, 0, 6.3); ctx.fill();
    }
    ctx.restore();
  }
  function hud() {
    ctx.font = '600 13px ' + UI; ctx.textBaseline = 'top';
    ctx.fillStyle = 'rgba(12,11,15,0.74)'; ctx.fillRect(10, 10, 180, 112);
    ctx.fillStyle = '#d6402a'; ctx.fillRect(10, 10, 3, 112);
    ctx.fillStyle = '#ece6d6'; ctx.textAlign = 'left'; ctx.fillText(t('lv', level), 22, 18);
    ctx.textAlign = 'right'; ctx.fillStyle = '#f0b44a'; ctx.fillText(t('pts', score), 180, 18);
    ctx.textAlign = 'left'; ctx.fillStyle = 'rgba(236,230,214,0.65)'; ctx.fillText(t('ink'), 22, 40);
    ctx.fillStyle = 'rgba(236,230,214,0.18)'; ctx.fillRect(54, 43, 126, 8);
    var f = s.ink / s.inkMax; ctx.fillStyle = f < 0.25 ? '#d6402a' : '#ece6d6'; ctx.fillRect(54, 43, 126 * f, 8);
    var ok = s.vy <= SAFE_VY, up = Math.abs(s.a) <= SAFE_A;
    ctx.fillStyle = 'rgba(236,230,214,0.65)'; ctx.fillText(t('speed'), 22, 60);
    ctx.textAlign = 'right'; ctx.fillStyle = ok ? '#8fd08a' : '#d6402a'; ctx.fillText(Math.round(Math.max(0, s.vy)) + ' / ' + SAFE_VY + ' ' + t(ok ? 'ok' : 'fast'), 180, 60);
    ctx.textAlign = 'left'; ctx.fillStyle = 'rgba(236,230,214,0.65)'; ctx.fillText(t('pose'), 22, 80);
    ctx.textAlign = 'right'; ctx.fillStyle = up ? '#8fd08a' : '#d6402a'; ctx.fillText(up ? t('upright') : t('tilt', Math.round(Math.abs(s.a) * 57.3)), 180, 80);
    ctx.textAlign = 'left'; ctx.fillStyle = 'rgba(236,230,214,0.65)'; ctx.fillText(t('wind'), 22, 100);
    var n = Math.ceil(Math.abs(wind) / 12), a = ''; for (var i = 0; i < n; i++) a += wind < 0 ? '←' : '→';
    ctx.textAlign = 'right'; ctx.fillStyle = '#ece6d6'; ctx.fillText(a || t('calm'), 180, 100);
    var l = ''; for (var j = 0; j < lives; j++) l += '🦑'; ctx.fillText(l, W - 12, 16);
    ctx.fillStyle = 'rgba(236,230,214,0.65)'; ctx.fillText(t('best', best), W - 12, 38);
    if (chal) { ctx.fillStyle = score > chal.score ? '#8fd08a' : '#f0b44a'; ctx.fillText(A('target', chal.score), W - 12, 58); }
    if (mode === 'play' && s.y < -HALF) { ctx.fillStyle = '#f0b44a'; ctx.beginPath(); ctx.moveTo(s.x, 6); ctx.lineTo(s.x - 7, 18); ctx.lineTo(s.x + 7, 18); ctx.fill(); }
  }
  function caption() {
    ctx.fillStyle = 'rgba(12,11,15,0.9)'; ctx.fillRect(0, H - 66, W, 66);
    ctx.fillStyle = '#d6402a'; ctx.fillRect(0, H - 66, W, 3);
    ctx.textBaseline = 'middle'; ctx.textAlign = 'left';
    ctx.font = '800 22px ' + DISPLAY; ctx.fillStyle = '#ece6d6'; ctx.fillText(t('title'), 16, H - 40);
    ctx.font = '600 12px ' + UI; ctx.fillStyle = 'rgba(236,230,214,0.65)';
    ctx.fillText(mode === 'caught' ? t('capStat', Math.round(s.catchVy), Math.round(s.ink / s.inkMax * 100)) : (location.host || 'Pocket Arcade'), 16, H - 17);
    ctx.textAlign = 'right'; ctx.font = '700 18px ' + UI; ctx.fillStyle = '#f0b44a'; ctx.fillText(t('lv', level) + '　' + t('pts', score), W - 16, H - 34);
  }
  function draw() {
    var i, p;
    ctx.drawImage(bg, 0, 0);
    var cx = -(((cloudX % (W * 2)) + W * 2) % (W * 2));
    ctx.drawImage(clouds, cx, 0); ctx.drawImage(clouds, cx + W * 2, 0);
    for (i = 0; i < pools.length; i++) { ctx.fillStyle = 'rgba(10,9,14,0.8)'; ctx.beginPath(); ctx.ellipse(pools[i].x, pools[i].y, pools[i].rx, pools[i].ry, 0, 0, 6.3); ctx.fill(); }
    tower();
    if (mode === 'play') {                                                           // where the tips can reach
      ctx.strokeStyle = 'rgba(240,180,74,0.5)'; ctx.setLineDash([4, 5]); ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.moveTo(ZONE0 - RAD, ARM_Y - 44); ctx.lineTo(ZONE0 - RAD, ARM_Y - 18); ctx.moveTo(ZONE1 + RAD, ARM_Y - 44); ctx.lineTo(ZONE1 + RAD, ARM_Y - 18); ctx.stroke();
      ctx.setLineDash([]);
    }
    stick(false);
    for (i = 0; i < parts.length; i++) {                                             // sumi ink: dark core, soft bleeding halo
      p = parts[i]; if (p.k !== 0) continue;
      var al = 1 - p.life / p.max;
      ctx.fillStyle = 'rgba(30,28,40,' + al * 0.22 + ')'; ctx.beginPath(); ctx.arc(p.x + Math.cos(p.sd) * p.r * 0.3, p.y + Math.sin(p.sd) * p.r * 0.3, p.r * 1.35, 0, 6.3); ctx.fill();
      ctx.fillStyle = 'rgba(10,9,15,' + al * 0.55 + ')'; ctx.beginPath(); ctx.arc(p.x, p.y, p.r * 0.8, 0, 6.3); ctx.fill();

    ctx.globalCompositeOperation = 'lighter';
    for (i = 0; i < parts.length; i++) {
      p = parts[i]; if (p.k !== 1) continue;

      ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p.x - p.vx * 0.03, p.y - p.vy * 0.03); ctx.stroke();

    }

    vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,0.42)');

    ctx.save(); ctx.globalAlpha = 0.07; ctx.globalCompositeOperation = 'overlay';
    if (!REDUCED) ctx.translate(-Math.random() * 128, -Math.random() * 128);
    ctx.fillStyle = grainPat; ctx.fillRect(0, 0, W + 128, H + 128); ctx.restore();
    if (mode !== 'title' && !noHud) hud();
    if (beatT >= 0 && time - beatT < 2.6 && !noHud) {

      ctx.font = '800 26px ' + DISPLAY; ctx.lineWidth = 4; ctx.lineJoin = 'round'; ctx.strokeStyle = '#0b0a0d';
      ctx.strokeText(A('beaten'), W / 2, 140); ctx.fillStyle = '#f0b44a'; ctx.fillText(A('beaten'), W / 2, 140); ctx.restore();

      ctx.font = '800 ' + (42 + (1 - k) * 24) + 'px ' + DISPLAY;
      ctx.lineWidth = 5; ctx.lineJoin = 'round'; ctx.strokeStyle = '#ece6d6'; ctx.strokeText(txt, 150, 190);
      ctx.fillStyle = '#d6402a'; ctx.fillText(txt, 150, 190); ctx.restore();

  }

  // ---------- input ----------
  function advance() {
    if (!overlayShown || photo) return;
    if (mode === 'title' || mode === 'over') newGame();
    else if (mode === 'caught') { level++; startLevel(); }
    else if (mode === 'fail') startLevel();
  }
  pBtn.addEventListener('click', advance);
  var map = { ArrowLeft: 'l', a: 'l', A: 'l', ArrowRight: 'r', d: 'r', D: 'r', ArrowUp: 'u', w: 'u', W: 'u', ' ': 'u' };
  var btns = { l: document.getElementById('bL'), u: document.getElementById('bU'), r: document.getElementById('bR') };
  function setKey(k, v) { keys[k] = v; btns[k].classList.toggle('on', v); }
  addEventListener('keydown', function (e) {
    if (overlayShown) {
      var onSmall = e.target && e.target.classList && (e.target.classList.contains('sm') || e.target.classList.contains('lg'));
      if ((e.key === 'Enter' || e.key === ' ') && !e.repeat && !onSmall) { e.preventDefault(); advance(); }
      return;
    }
    var k = map[e.key]; if (k) { e.preventDefault(); setKey(k, true); }
  });
  addEventListener('keyup', function (e) { var k = map[e.key]; if (k) setKey(k, false); });
  addEventListener('blur', function () { setKey('l', false); setKey('r', false); setKey('u', false); });
  Object.keys(btns).forEach(function (k) {
    var b = btns[k];
    b.addEventListener('pointerdown', function (e) { e.preventDefault(); try { b.setPointerCapture(e.pointerId); } catch (x) {} setKey(k, true); });
    ['pointerup', 'pointercancel', 'lostpointercapture'].forEach(function (ev) { b.addEventListener(ev, function () { setKey(k, false); }); });
    b.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  });

  // ---------- score card, share, challenge (Pocket Arcade standard flow) ----------
  var GAME = 'wild-catch', chal = Arcade.readChallenge(GAME), beatT = -1, perfects = 0, noHud = false;
  var moment = document.createElement('canvas'); moment.width = W; moment.height = H;
  var hasMoment = false, wantMoment = false;
  var card = { result: null, blob: null, link: '', img: '', token: null };
  function say(tx) { pMsg.textContent = tx; pMsg.hidden = false; }
  function chalText() {
    if (!chal) return '';
    if (mode === 'title') return A('vs', chal.level, chal.score);
    if (score > chal.score) return mode === 'over' ? A('won', chal.score) : A('beaten');
    return A('toBeat', chal.score - score + 1);
  }
  function cleanFrame(into) { noHud = true; draw(); into.getContext('2d').drawImage(cv, 0, 0, W, H); noHud = false; draw(); }
  function finish() {   // one JSON result per finished round (a catch or game over)
    card.result = Arcade.result(GAME, { score: score, level: level, outcome: mode === 'caught' ? 'clear' : 'over',
      perfect: perfects > 0, lang: lang, stats: { perfects: perfects, livesLeft: lives, best: best } });
  }
  function post() { return t(score > 0 ? 'post' : 'postMiss', score, level, card.link); }
  function prepCard() {
    if (!card.result) return;
    var snap = hasMoment ? moment : (function () { var c = document.createElement('canvas'); c.width = W; c.height = H; cleanFrame(c); return c; })();
    var pf = t('perfect').replace(/[！!]\s*$/, '');
    card.link = Arcade.challengeUrl(card.result, lang);
    var cvs = Arcade.renderCard({ game: GAME, lang: lang, snapshot: snap, title: t('title'), score: score,
      detail: t('lv', level) + (perfects ? '　' + pf + ' ×' + perfects : ''), url: card.link });
    var token = {}; card.token = token; card.blob = null;
    Arcade.toBlob(cvs).then(function (b) {
      if (card.token !== token) return;
      card.blob = b;
      if (b && mode === 'over') { if (card.img) URL.revokeObjectURL(card.img); card.img = URL.createObjectURL(b); pCard.src = card.img; pCard.hidden = false; }
      else pCard.hidden = true;
    });
  }
  function fileName() { return 'wild-catch-' + score + '.png'; }
  bPhoto.addEventListener('click', function (e) {
    e.stopPropagation(); photo = true; panel.hidden = true; hint.hidden = false;
    setTimeout(function () { hint.hidden = true; }, 1800);
  });
  document.querySelector('.stage').addEventListener('click', function () {
    if (photo && panel.hidden) { photo = false; hint.hidden = true; panel.hidden = false; }
  });
  function copyPost() {
    var tx = post();
    return Arcade.copy(tx).then(function (ok) {
      if (ok) return true;
      say(tx); var r = document.createRange(); r.selectNodeContents(pMsg); var sel = getSelection(); sel.removeAllRanges(); sel.addRange(r);
      return false;
    });
  }
  bShare.addEventListener('click', function (e) {
    e.stopPropagation(); if (!card.result) return;
    Arcade.share({ title: t('title'), text: post(), url: card.link, blob: card.blob, filename: fileName() }).then(function (st) {
      if (st === 'shared' || st === 'aborted') return;
      copyPost().then(function (ok) { if (ok) say(A('noShare')); });
    });
  });
  bShare.hidden = !navigator.share;
  function sendTo(target) { if (card.result) Arcade.shareTo(target, post()); }
  bWa.addEventListener('click', function (e) { e.stopPropagation(); sendTo('whatsapp'); });
  bTh.addEventListener('click', function (e) { e.stopPropagation(); sendTo('threads'); });
  bCard.addEventListener('click', function (e) {
    e.stopPropagation();
    if (!card.blob) { say(A('cardFail')); return; }
    Arcade.download(card.blob, fileName()); say(A('saved'));
  });
  bCopy.addEventListener('click', function (e) { e.stopPropagation(); copyPost().then(function (ok) { if (ok) say(A('copied')); }); });
  var lgs = document.querySelectorAll('.lg');
  for (var li = 0; li < lgs.length; li++) lgs[li].addEventListener('click', function (e) { setLang(e.currentTarget.getAttribute('data-lang'), true); e.currentTarget.blur(); });
  setLang(Arcade.pickLang(), false);

  // ---------- loop ----------
  var last = performance.now();
  function frame(now) {
    var dt = Math.min(0.033, (now - last) / 1000); last = now;
    if (mode === 'title') { time += dt; cloudX += 8 * dt; s.x = 170 + Math.sin(time * 0.7) * 30; s.y = 215 + Math.sin(time * 1.1) * 14; s.a = Math.sin(time * 0.9) * 0.25; tip = 150; }
    else update(dt);
    draw();
    if (wantMoment && mode === 'caught' && modeT > 2.7) { wantMoment = false; cleanFrame(moment); hasMoment = true; }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
